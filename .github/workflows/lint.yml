name: Lint — Thalos Prime

on:
  push:
  pull_request:

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.10
      - run: ruff check . --output-format=github
      - run: ruff format --check .
