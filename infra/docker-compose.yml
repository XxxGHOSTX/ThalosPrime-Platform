version: '3.9'

services:
  thalos-core:
    build:
      context: ..
      dockerfile: infra/Dockerfile.core
    ports:
      - "8000:8000"
    volumes:
      - ../STATELOG:/app/STATELOG
    environment:
      - OWNER=Tony Ray Macier III
      - SEED_STRENGTH=64BIT
      - DATABASE_URL=sqlite:///STATELOG/state.db
      - THALOS_API_TOKEN=${THALOS_API_TOKEN:-thalos-dev-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  thalos-sentinel:
    build:
      context: ..
      dockerfile: infra/Dockerfile.core
    command: ["python", "-m", "uvicorn", "services.discovery_sentinel.mcp_server:app",
              "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ../STATELOG:/app/STATELOG
    environment:
      - OWNER=Tony Ray Macier III
      - THALOS_API_TOKEN=${THALOS_API_TOKEN:-thalos-dev-token}
    depends_on:
      thalos-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - thalos-core

