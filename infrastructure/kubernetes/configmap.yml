  PLATFORM_VERSION: "2.0.0"
  SEED_STRENGTH: "64BIT"
  STATELOG_PATH: "/app/STATELOG/events.jsonl"
  DATABASE_URL: "sqlite:////app/STATELOG/state.db"
  LOG_LEVEL: "INFO"
