# Thalos Prime ConfigMap — non-secret runtime configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: thalos-config
  namespace: thalos-prime
  labels:
    app: thalos-prime
    owner: tony-ray-macier-iii
data:
