# Thalos Prime Kubernetes Secret — TEMPLATE ONLY
# Replace placeholder values before applying to a live cluster.
# Use `kubectl create secret` or a secrets manager (e.g., Vault, AWS Secrets Manager).

apiVersion: v1
kind: Secret
metadata:
  name: thalos-secrets
  namespace: thalos-prime
  labels:
    app: thalos-prime
    owner: tony-ray-macier-iii
type: Opaque
stringData:
  # Replace with your actual 64-bit execution seed (decimal integer as string)
  execution-seed: "REPLACE_WITH_64BIT_SEED"
  # Replace with your actual API token for HTTP ingest authentication
  api-token: "REPLACE_WITH_API_TOKEN"
