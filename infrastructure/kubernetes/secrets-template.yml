# Thalos Prime Kubernetes Secret — TEMPLATE ONLY
# Replace the values below before applying to a live cluster.
# Recommended: use `kubectl create secret` or a secrets manager (Vault, AWS SM).

apiVersion: v1
kind: Secret
metadata:
  name: thalos-secrets
  namespace: thalos-prime
  labels:
    app: thalos-prime
    owner: tony-ray-macier-iii
type: Opaque
stringData:
  # Set to your actual 64-bit execution seed (decimal integer as string)
  execution-seed: "SET_YOUR_64BIT_SEED_HERE"
  # Set to your actual API token for HTTP ingest authentication
  api-token: "SET_YOUR_API_TOKEN_HERE"
